services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: niyosense_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - SECRET_KEY=${SECRET_KEY:-niyosense_super_secret_production_key_2026}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DATABASE_URL=${DATABASE_URL:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-https://*.trycloudflare.com,https://*.ngrok-free.app,http://localhost:8000,http://127.0.0.1:8000}
    volumes:
      # Persistent media storage: uploaded coconut husk images and 4s .wav audio files
      - ./media:/app/media
      # Persistent static files storage served via Whitenoise
      - ./static:/app/static
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/system/host-ip/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
