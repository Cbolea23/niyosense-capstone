{% load static %}
<!-- Tailwind QR Code Modal (Pairing) -->
<div id="qrModal"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-200">
    <div
        class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center relative animate-in fade-in zoom-in-95 duration-150">
        <button onclick="hideQrModal()" type="button"
            class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">
            &times;
        </button>

        <div
            class="w-12 h-12 bg-emerald-50 border border-emerald-100 rounded-2xl p-1.5 flex items-center justify-center mx-auto mb-3 shadow-sm">
            <img src="{% static 'logo/logo.png' %}" alt="NiyoSense Logo" class="w-full h-full object-contain rounded-xl" />
        </div>

        <h3 class="text-base font-bold text-slate-800 mb-1" data-i18n="qr_modal_title">Pair Mobile App</h3>
        <p class="text-xs text-slate-400 mb-4 px-2" data-i18n="qr_modal_desc">Scan this QR code in the NiyoSense mobile app to pair with your server endpoint.</p>

        <div
            class="bg-slate-50 border border-slate-100 rounded-2xl p-4 my-2 flex justify-center items-center min-h-[200px]">
            <div id="qrcode" class="flex justify-center items-center"></div>
        </div>

        <p id="qrServerUrl"
            class="text-xs font-mono font-semibold text-emerald-600 bg-emerald-50/70 border border-emerald-100 rounded-xl py-2 px-3 mt-3 truncate">
            http://127.0.0.1:8000
        </p>

        <button onclick="hideQrModal()" type="button"
            class="mt-5 w-full bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-3 rounded-xl transition" data-i18n="qr_modal_close">
            Close
        </button>
    </div>
</div>

<!-- Tailwind QR Code Modal (APK Installation) -->
<div id="apkQrModal"
    class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-200">
    <div
        class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-slate-100 text-center relative animate-in fade-in zoom-in-95 duration-150">
        <button onclick="hideApkQrModal()" type="button"
            class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">
            &times;
        </button>

        <div
            class="w-12 h-12 bg-teal-50 border border-teal-100 rounded-2xl p-1.5 flex items-center justify-center mx-auto mb-3 shadow-sm">
            <img src="{% static 'logo/logo.png' %}" alt="NiyoSense Logo" class="w-full h-full object-contain rounded-xl" />
        </div>

        <h3 class="text-base font-bold text-slate-800 mb-1" data-i18n="apk_qr_modal_title">Install Mobile App (APK)</h3>
        <p class="text-xs text-slate-400 mb-4 px-2" data-i18n="apk_qr_modal_desc">Scan this QR code with your phone camera to download and install NiyoSense directly.</p>

        <div
            class="bg-slate-50 border border-slate-100 rounded-2xl p-4 my-2 flex justify-center items-center min-h-[200px]">
            <div id="apkQrcode" class="flex justify-center items-center"></div>
        </div>

        <p id="apkQrUrlDisplay"
            class="text-xs font-mono font-semibold text-teal-700 bg-teal-50/70 border border-teal-100 rounded-xl py-2 px-3 mt-3 truncate">
            /media/downloads/niyosense.apk
        </p>

        <div class="mt-4 flex gap-2">
            <a id="apkDirectLink" href="/media/downloads/niyosense.apk" download="niyosense.apk"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-3 rounded-xl transition flex items-center justify-center shadow-sm">
                <span data-i18n="download_apk_btn">Download</span>
            </a>
            <button onclick="hideApkQrModal()" type="button"
                class="w-1/3 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-3 rounded-xl transition" data-i18n="qr_modal_close">
                Close
            </button>
        </div>
    </div>
</div>
