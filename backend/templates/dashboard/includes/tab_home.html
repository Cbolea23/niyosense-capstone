<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <!-- Real-Time Total Scans Card -->
    <div class="bg-emerald-600 text-white p-6 rounded-2xl shadow-sm relative overflow-hidden">
        <div class="flex justify-between items-start mb-4">
            <div class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center text-lg">🌴
            </div>
            <span id="stat-scans-today"
                class="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs font-semibold">+{{ scans_today }}
                today</span>
        </div>
        <h2 id="stat-total-scans" class="text-4xl font-extrabold mb-1">{{ total_scans }}</h2>
        <p class="text-xs text-emerald-100 font-medium" data-i18n="total_scans">Total Coconuts Scanned</p>
        <p class="text-[10px] text-emerald-200/70 mt-1">All-time across recorded visits</p>
    </div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h3 class="font-bold text-slate-800 text-sm">Daily Maturity Report</h3>
                <p class="text-xs text-slate-400">Scans captured over the last 7 days</p>
            </div>
            <span class="text-xs font-semibold px-2.5 py-1 bg-emerald-50 text-emerald-600 rounded-lg">Live Synced</span>
        </div>
        <div class="h-64">
            <canvas id="dailyChart"></canvas>
        </div>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
        <h3 class="font-bold text-slate-800 text-sm mb-1">Maturity Distribution</h3>
        <p class="text-xs text-slate-400 mb-6">All visits combined</p>
        <div class="h-52 flex items-center justify-center">
            <canvas id="maturityChart"></canvas>
        </div>
    </div>
</div>
